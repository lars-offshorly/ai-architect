<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Architect | Smart Workspace Builder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- Left Side: Chat & Status -->
      <aside class="sidebar">
        <header class="sidebar-header">
          <div class="logo">
            <span class="logo-icon">🏗️</span>
            <h1>AI Architect</h1>
          </div>
          <p class="subtitle">Personalized Workspace Generator</p>
        </header>

        <section class="chat-section">
          <div id="chatLog" class="chat-log">
            <!-- Messages will be injected here -->
          </div>

          <div class="quick-suggestions">
            <button class="suggestion-chip" data-msg="I want to have an app to manage my IT team's tickets">
              🎫 IT Ticketing App
            </button>
          </div>

          <div class="chat-input-area">
            <div class="input-wrapper">
              <textarea
                id="messageInput"
                placeholder="I want an HR app for 50 people..."
                rows="1"
              ></textarea>
              <button id="sendBtn" class="send-btn">Send</button>
            </div>
          </div>
        </section>

        <section class="pipeline-section">
          <h3>Internal State</h3>
          <div id="pipelineContainer">
            <!-- Pipeline status will be injected here -->
          </div>
        </section>
      </aside>

      <!-- Right Side: Preview / Canvas -->
      <main class="main-content">
        <div id="previewPanel" class="preview-panel">
          <!-- Dashboard will be injected here -->
          <div class="preview-placeholder">
            <div class="placeholder-content">
              <span>📊</span>
              <h2>Interactive Preview</h2>
              <p>Chat with the AI to generate your personalized dashboard and app configuration.</p>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="/static/app.js" type="module"></script>
  </body>
</html>
