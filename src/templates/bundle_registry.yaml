bundles:
  - bundle_key: hr_hub
    display_name: HR Hub
    primary_entity: people
    description: Workspace for HR teams to manage employee requests, onboarding, and operational visibility.
    default_modules:
      - tickets
      - queues
      - kpis
      - dashboard
    optional_modules:
      - forms
      - approvals
      - knowledge_base
    required_slots:
      - team_size
      - primary_use_case
    industry_hints:
      - human resources
      - people operations
      - talent
      - recruiting
      - hr
      - tech
      - agency
      - healthcare
      - logistics
    template_dir: hr_hub
    customizable_fields:
      - company_name
      - employee_names
      - department_names
      - role_names
      - status_labels

  - bundle_key: project_ops
    display_name: Project Operations
    primary_entity: work
    description: Workspace for planning and delivering projects with structured execution tracking.
    default_modules:
      - tasks
      - timelines
      - milestones
      - dashboard
    optional_modules:
      - risk_register
      - resource_planning
      - timesheets
    required_slots:
      - project_count
      - team_size
    industry_hints:
      - project management
      - consulting
      - delivery
      - implementation
      - operations
    template_dir: project_ops
    customizable_fields:
      - company_name
      - project_names
      - team_names
      - milestone_labels

  - bundle_key: asset_mgmt
    display_name: Asset Management
    primary_entity: asset
    description: Workspace for lifecycle tracking, maintenance, and service workflows for physical assets.
    default_modules:
      - assets
      - maintenance
      - tickets
      - dashboard
    optional_modules:
      - inventory
      - vendors
      - compliance
    required_slots:
      - asset_types
      - location_count
    industry_hints:
      - asset
      - equipment
      - facility
      - fleet
      - warehouse
    template_dir: asset_mgmt
    customizable_fields:
      - company_name
      - asset_categories
      - location_names
      - status_labels

  - bundle_key: field_service
    display_name: Field Service
    primary_entity: work
    description: Workspace for dispatching technicians, scheduling field jobs, and tracking service quality.
    default_modules:
      - work_orders
      - scheduling
      - forms
      - dashboard
    optional_modules:
      - parts_inventory
      - sla_tracking
      - mobile_checklists
    required_slots:
      - service_zones
      - technician_count
    industry_hints:
      - field service
      - dispatch
      - technician
      - onsite
      - repair
    template_dir: field_service
    customizable_fields:
      - company_name
      - technician_names
      - zone_names
      - service_types

  - bundle_key: generic
    display_name: Custom Workspace
    primary_entity: work
    description: Fallback workspace for requests that do not confidently map to a specialized bundle.
    default_modules:
      - tickets
      - dashboard
    optional_modules:
      - notes
      - forms
      - tasks
    required_slots:
      - primary_use_case
    industry_hints:
      - custom
      - general
      - other
      - misc
      - unknown
    template_dir: generic
    customizable_fields:
      - company_name
      - primary_use_case
