# =============================================================================
# Bundle Registry — Canonical source of truth for bundle definitions.
# Ownership (AD-2): This file owns classification signals, bundle identity,
# module lists, required slots, and metadata per bundle.
# Template JSON files own renderable template content.
# Overlap fields (display_name, modules): registry takes precedence for
# classification/orchestration; template files take precedence for rendering.
# =============================================================================

bundles:

  # ---------------------------------------------------------------------------
  # 1. HR Management
  # ---------------------------------------------------------------------------
  - bundle_key: hr_management
    display_name: HR Management
    primary_entity: people
    description: Handles employee lifecycle including hiring, onboarding, payroll, attendance, and performance management.
    template_dir: hr_hub
    dummy_data_template_key: hr_management_base
    customizable_fields:
      - company_name
      - employee_names
      - department_names
      - role_names
      - leave_types
      - status_labels

    default_modules:
      - hr_hub
      - chat
      - video_call
      - kpi
      - rewards_store
      - weaves
    optional_modules:
      - profile
      - dashboard
      - announcements
    knit_service_bundles:
      - hr_hub
      - chat
      - video_call
      - weaves
    required_slots:
      - team_size
      - primary_use_case

    synonyms:
      - human resources
      - people management
      - people ops
      - HR system
      - employee management
      - workforce management
      - talent management
      - staff management
    typical_entities:
      - employee
      - manager
      - department
      - leave request
      - attendance record
      - payroll
      - onboarding task
    typical_intents:
      - manage employees
      - track attendance
      - handle leave requests
      - run payroll
      - onboard new hires
      - offboard employees
      - track performance
      - manage recruitment
    required_signals:
      - employee-related workflow
      - hr or people operations process
    # NOTE: Multi-word keys (e.g. "people ops", "service desk") require phrase-level
    # matching. The classifier must check these as substrings/phrases, not single tokens.
    signal_boosts:
      employee: 0.15
      hr: 0.20
      leave: 0.20
      onboarding: 0.15
      payroll: 0.20
      attendance: 0.15
      people ops: 0.20
      recruitment: 0.10
      offboarding: 0.15
      workforce: 0.10
    terminology:
      primary_record_label: employee
      approver_label: manager
      request_label: leave request

    metadata:
      kpis:
        - active_headcount
        - attendance_rate
        - leave_balance_utilization
        - capacity_utilization
        - workload_distribution
      workflows:
        - employee_onboarding
        - leave_request_and_approval
        - attendance_tracking
        - performance_review
        - offboarding
        - payroll_processing
      entity_definitions:
        employee:
          label: Employee
          plural: Employees
        leave_request:
          label: Leave Request
          plural: Leave Requests
        department:
          label: Department
          plural: Departments
      onboarding_config_requirements:
        - default_schedules
        - leave_types
        - leave_policy
        - regularization_dates
        - department_structure
      coverage:
        - employee reporting
        - schedules
        - attendance
        - records
      settings_configurations:
        - default schedules
        - leave types
        - leave policy
        - regularization dates

