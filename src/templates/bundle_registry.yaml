# =============================================================================
# Bundle Registry — Canonical source of truth for bundle definitions.
# Ownership (AD-2): This file owns classification signals, bundle identity,
# module lists, required slots, and metadata per bundle.
# Template JSON files own renderable template content.
# Overlap fields (display_name, modules): registry takes precedence for
# classification/orchestration; template files take precedence for rendering.
# =============================================================================

bundles:

  # ---------------------------------------------------------------------------
  # 1. HR Management
  # ---------------------------------------------------------------------------
  - bundle_key: hr_management
    render_key: hr_hub
    display_name: HR Management
    primary_entity: people
    description: Handles employee lifecycle including hiring, onboarding, payroll, attendance, and performance management.
    template_dir: hr_hub
    dummy_data_template_key: hr_management_base
    customizable_fields:
      - company_name
      - employee_names
      - department_names
      - role_names
      - leave_types
      - status_labels
    flags:
      - hrhub-module
      - hrhub-overview
      - hrhub-employee-movement
      - hrhub-onboarding
      - hrhub-employee-handbook
      - hrhub-admin-hangout
      - hrhub-tasks
      - hrhub-my-tasks
      - hrhub-live-feed
      - app-homepage-hr-hub
      - dashboard-module
      - menu-dashboard-nav
      - kpi-module
      - menu-kpi-nav
      - push-notification
      - activity-feed-module
      - activity-feed-notification
      - activity-feed-notifications-toast
      - activity-feed-unread-count
      - activity-feed-filter-hrhub
      - activity-feed-filter-dashboard
      - profile-module
      - rewards-module
    permission_services:
      - hr_hub
      - kpi
      - notifications
    landing_pages:
      - id: 311
        module: Dashboard
        selectionAutoShow: true
        default: Dashboard
        showTutorial: false
    compatible_addons:
      - chat
      - video_call
      - smart_vault
      - announcements
      - weaves

    default_modules:
      - hr_hub
      - chat
      - video_call
      - kpi
      - rewards_store
      - weaves
    optional_modules:
      - profile
      - dashboard
      - announcements
    knit_service_bundles:
      - hr_hub
      - chat
      - video_call
      - weaves
    required_slots:
      - team_size
      - primary_use_case

    synonyms:
      - human resources
      - people management
      - people ops
      - HR system
      - employee management
      - workforce management
      - talent management
      - staff management
    typical_entities:
      - employee
      - manager
      - department
      - leave request
      - attendance record
      - payroll
      - onboarding task
    typical_intents:
      - manage employees
      - track attendance
      - handle leave requests
      - run payroll
      - onboard new hires
      - offboard employees
      - track performance
      - manage recruitment
    required_signals:
      - employee-related workflow
      - hr or people operations process
    # NOTE: Multi-word keys (e.g. "people ops", "service desk") require phrase-level
    # matching. The classifier must check these as substrings/phrases, not single tokens.
    signal_boosts:
      employee: 0.15
      hr: 0.20
      leave: 0.20
      onboarding: 0.15
      payroll: 0.20
      attendance: 0.15
      people ops: 0.20
      recruitment: 0.10
      offboarding: 0.15
      workforce: 0.1
    terminology:
      primary_record_label: employee
      approver_label: manager
      request_label: leave request

    extraction_keywords:
      industry: ["onboarding", "offboarding", "employee", "headcount", "payroll", "performance review", "hr", "human resources", "leave", "attendance", "recruitment", "hiring", "org chart"]
      industry_detail: "Human Resources"

    variants:
      - key: app-01
        display_name: HR & Attendance
        description: General HR management with attendance, timekeeping, and workforce oversight.
        is_default: true
        clarification_label: general HR & attendance
        dashboard_template: hr_management
        keywords:
          - hr
          - people
          - human resources
          - employees
          - attendance
          - workforce
          - headcount
          - timekeeping
          - shifts
          - roster
        anti_keywords:
          - recruiting
          - recruitment
          - candidate
          - onboarding
          - offboarding
        typical_entities:
          - employee
          - department
          - attendance_record
          - leave_request
        typical_intents:
          - track attendance
          - manage workforce
          - monitor headcount
          - handle leave requests

      - key: app-02
        display_name: Recruiting
        description: Talent acquisition, candidate pipeline, interviews, and hiring.
        clarification_label: recruiting & hiring
        dashboard_template: hr_management_recruiting
        keywords:
          - recruitment
          - recruiting
          - hiring
          - candidates
          - interview
          - applicant
          - talent acquisition
          - job opening
          - pipeline
          - offer letter
        anti_keywords:
          - attendance
          - timekeeping
          - shift
          - onboarding
        typical_entities:
          - candidate
          - applicant
          - interview
          - job_opening
        typical_intents:
          - hire a candidate
          - run interview loop
          - manage job openings
          - track applicants

      - key: app-03
        display_name: Onboarding & Offboarding
        description: New-hire orientation, probation tracking, and exit clearance.
        clarification_label: onboarding & offboarding
        dashboard_template: hr_management_onboarding
        keywords:
          - onboarding
          - offboarding
          - new hire
          - exit
          - probation
          - separation
          - orientation
          - clearance
        anti_keywords:
          - attendance
          - timekeeping
          - recruiting
          - candidate
        typical_entities:
          - new_hire
          - onboarding_plan
          - offboarding_case
        typical_intents:
          - onboard new hires
          - run exit clearance
          - track probation

    metadata:
      kpis:
        - active_headcount
        - attendance_rate
        - leave_balance_utilization
        - capacity_utilization
        - workload_distribution
      workflows:
        - employee_onboarding
        - leave_request_and_approval
        - attendance_tracking
        - performance_review
        - offboarding
        - payroll_processing
      entity_definitions:
        employee:
          label: Employee
          plural: Employees
        leave_request:
          label: Leave Request
          plural: Leave Requests
        department:
          label: Department
          plural: Departments
      onboarding_config_requirements:
        - default_schedules
        - leave_types
        - leave_policy
        - regularization_dates
        - department_structure
      coverage:
        - employee reporting
        - schedules
        - attendance
        - records
      settings_configurations:
        - default schedules
        - leave types
        - leave policy
        - regularization dates
      entity_relationships:
        - source: department
          target: employee
          type: has_many
        - source: employee
          target: department
          type: belongs_to  
        - source: employee
          target: leave_request
          type: has_many
        - source: leave_request
          target: employee
          type: belongs_to

