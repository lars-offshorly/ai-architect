          label: Employee
          plural: Employees
        ticket:
          label: Ticket
          plural: Tickets
        project:
          label: Project
          plural: Projects
      onboarding_config_requirements:
        - all configurations from all hubs
      coverage:
        - all features from all hubs
      settings_configurations:
        - all configurations from all hubs

