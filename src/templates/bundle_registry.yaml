          label: Ticket
          plural: Tickets
        queue:
          label: Queue
          plural: Queues
        agent:
          label: Agent
          plural: Agents
      onboarding_config_requirements:
        - management_queue_setup
        - ticket_counter_selection
        - sla_rules
        - category_definitions
      coverage:
