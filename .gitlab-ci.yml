stages:
  - test
  - quality
  - security
  - build
  - deploy

default:
  image: public.ecr.aws/v5v9u0r4/docker-awscli:latest

variables:
  PYTHONPATH: "src:."
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  POETRY_CACHE_DIR: "$CI_PROJECT_DIR/.poetry-cache"

.docker_aws_variables:
  variables: &deploy_variables
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    AWS_ACCESS_KEY_ID: "$AWS_ACCESS_KEY_ID"
    AWS_SECRET_ACCESS_KEY: "$AWS_SECRET_ACCESS_KEY"
    AWS_DEFAULT_REGION: "$AWS_DEFAULT_REGION"

.base_python:
  image: python:3.10
  cache:
    key:
      files:
        - poetry.lock
    paths:
      - .venv/
      - .poetry-cache/
    policy: pull-push
  before_script:
    - python --version
    - pip install --upgrade pip setuptools wheel
    - pip install poetry
    - poetry --version
    - poetry install --with dev

.test_template:
  extends: .base_python
  script:
    - mkdir -p test-results
    - |
      poetry run pytest tests -v --tb=short --durations=20 --continue-on-collection-errors \
        --junitxml=test-results/junit.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: test-results/junit.xml
    paths:
      - test-results/
  allow_failure: false

unit_tests:
  extends: .test_template
  stage: test
  script:
    - mkdir -p test-results
    - poetry run pytest tests -v -m "not integration" --tb=short --durations=20 --junitxml=test-results/junit.xml

integration_tests:
  extends: .test_template
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "dev"'
  script:
    - mkdir -p test-results
    - |
      poetry run pytest tests -v -m integration --tb=short --durations=20 --continue-on-collection-errors \
        --junitxml=test-results/junit.xml

coverage:
  extends: .base_python
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "dev"'
  script:
    - |
      poetry run pytest tests -m "not integration" --cov=src --cov-report=term --cov-report=xml:coverage.xml --durations=20
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    expire_in: 1 week
    reports:
      junit: test-results/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - test-results/
      - coverage.xml

lint_mr:
  extends: .base_python
  stage: quality
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - !reference [.base_python, before_script]
    - git fetch --unshallow 2>/dev/null || true
    - git fetch origin dev 2>/dev/null || git fetch origin ${CI_DEFAULT_BRANCH:-main} 2>/dev/null || true
  script:
    - make lint-mr
  allow_failure: false

lint_commit:
  extends: .base_python
  stage: quality
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "dev"'
  script:
    - make lint
  allow_failure: false

security_scan:
  extends: .base_python
  stage: security
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "dev"'
  script:
    - pip install safety
    - poetry self add poetry-plugin-export || true
    - poetry export --without-hashes --with dev -f requirements.txt -o ci-requirements.txt
    - safety check -r ci-requirements.txt --full-report || true
  allow_failure: true
  artifacts:
    expire_in: 1 week
    paths:
      - ci-requirements.txt

.build_template:
  stage: build
  services:
    - name: docker:20.10.16-dind
      alias: docker
  script:
    - docker build -t "$REGISTRY_URL" -f docker/Dockerfile .
    - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$AWS_REGISTRY_URL"
    - docker push "$REGISTRY_URL"

.deploy_template:
  stage: deploy
  services:
    - name: docker:20.10.16-dind
      alias: docker
  script:
    - aws s3 cp .env "s3://knit-ecs-config/knit-ai-architect/${CI_ENVIRONMENT_NAME}/"
    - aws ecs update-service --region "$AWS_DEFAULT_REGION" --cluster "$CI_AWS_ECS_CLUSTER" --service "$CI_AWS_ECS_SERVICE" --desired-count 1 --force-new-deployment

build_dev:
  extends: .build_template
  variables:
    <<: *deploy_variables
    REGISTRY_URL: "$AWS_REGISTRY_URL/${CI_ENVIRONMENT_NAME}-knit-ai-architect"
  environment:
    name: dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

deploy_dev:
  extends: .deploy_template
  needs:
    - job: build_dev
  before_script:
    - cp "$DEV_VARIABLES" .env
  variables:
    <<: *deploy_variables
    CI_AWS_ECS_CLUSTER: "${CI_ENVIRONMENT_NAME}-knit"
    CI_AWS_ECS_SERVICE: "${CI_ENVIRONMENT_NAME}-knit-ai-architect"
  environment:
    name: dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
