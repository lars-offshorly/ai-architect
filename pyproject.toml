[tool.poetry]
package-mode = false

[project]
name = "ai-architect"
version = "0.1.0"
description = "AI-powered onboarding conversation pipeline"
authors = [{ name = "KNIT" }]
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    # Web
    "fastapi>=0.121.2,<0.122.0",
    "uvicorn>=0.38.0,<0.39.0",
    # LangChain / LangGraph
    "langchain-core==1.2.28",
    "langchain-openai==1.1.12",
    "langgraph==1.1.6",
    "langgraph-checkpoint-postgres>=3.0.2,<4.0.0",
    # Database
    "asyncpg>=0.30.0,<0.31.0",
    "psycopg[binary,pool]>=3.1.0",
    # HTTP
    "httpx>=0.28.1,<0.29.0",
    # Redis (auth token cache)
    "redis[asyncio]>=5.0.0,<6.0.0",
    # Config & validation
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    # Utilities
    "colorama>=0.4.6,<0.5.0",
    "pyyaml>=6.0.0,<7.0.0",
    # Monitoring
    "sentry-sdk>=2.47.0,<3.0.0",
    "aiofiles>=25.1.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[dependency-groups]
dev = [
    "black>=24.0.0",
    "flake8>=7.0.0",
    "pylint>=3.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.18.0",
    "types-pyyaml",
    "vulture>=2.11",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict_optional = true
disallow_incomplete_defs = true
no_warn_no_return = true
ignore_missing_imports = true
follow_imports = "skip"
exclude = "tests"

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "."]
markers = [
    "integration: mark test as an integration test (slow, exercises full stack)",
]

[tool.vulture]
ignore_names = ["cls"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/agents",
    "src/api",
    "src/core",
    "src/domain",
    "src/generator",
    "src/orchestrators",
    "src/repositories",
    "catalog",
]
